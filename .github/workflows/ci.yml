name: release-gates

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"

jobs:
  test-and-integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm
      - name: Install the locked development and production tree
        run: npm ci
      - name: Local contract gate
        run: npm run gate:local
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Load through the pinned Pi runtime
        run: npm run gate:pi
      - name: Edit-tool conflict with another package, per editProvider
        run: npm run gate:edit
      - name: Verify isolated Pi package installation and companion extensions
        run: npm run gate:install -- --package-dir .
