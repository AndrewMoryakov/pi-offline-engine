name: contract-ci

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit tests
        run: node --test
      - name: Runtime syntax
        run: npm run check
      - name: Extension TypeScript syntax
        run: node --experimental-strip-types --check extensions/index.ts
